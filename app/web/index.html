<!DOCTYPE html>
<html lang="bn">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="HSC English 1st & 2nd Paper practice — pass first, then A+. Works offline.">
  <meta name="theme-color" content="#2E7D6B">

  <!-- iOS / mobile web-app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EZPZ Study">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EZPZ Study — HSC English</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; }
    #ezpz-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif; color: #1F5A4C;
      transition: opacity .3s ease;
    }
    #ezpz-splash .name { font-size: 26px; font-weight: 800; letter-spacing: .3px; }
    #ezpz-splash .sub { font-size: 14px; color: #6b7c77; }
    #ezpz-splash .spinner {
      width: 38px; height: 38px; border: 4px solid #d7e6e1;
      border-top-color: #2E7D6B; border-radius: 50%;
      animation: ezpz-spin 0.9s linear infinite;
    }
    @keyframes ezpz-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Simple splash shown until Flutter boots; removed on first frame. -->
  <div id="ezpz-splash">
    <div class="spinner"></div>
    <div class="name">EZPZ Study</div>
    <div class="sub">লোড হচ্ছে…</div>
  </div>

  <script>
    // Hide the splash once Flutter has rendered its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('ezpz-splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 300); }
    });

    // Register our own service worker (Flutter's built-in one is deprecated).
    // This makes the PWA installable and caches the app shell for fast,
    // offline-capable repeat visits.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('Service worker registration failed:', e);
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
