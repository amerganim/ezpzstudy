# EZPZ Study -- HSC English topic map
#
# Weights are the ACTUAL 2025 board marks distribution, taken from the official
# "Revised Syllabus for HSC Examination 2025" documents:
#   - English 1st Paper (code 107, 100 marks): Reading 60 + Guided Writing 40
#   - English 2nd Paper (code 108, 100 marks): Grammar 60 + Composition 40
# One `hsc`-track topic == one real exam item, so the Predicted Board Score is
# honest. `basics`-track topics are foundational skills weak students need to
# reach a pass; they carry weight 0 (not a board item themselves) and are linked
# from the exam items they underpin via `remedial`.
#
# `track`: "basics" (Pass-first foundations) or "hsc" (full syllabus practice).
#   The app presents these as two sections. Priority order for content and for
#   the student journey is basics -> hsc.
# `label_bn`: Bangla display label (Bangla-first UI). English grammar terms are
#   kept in English where students recognise them.
# `remedial`: foundational topic ids that feed this exam item. Surfaced in-app
#   only as "Focus Area: <topic>", never labelled by class level.

schema_version: "2.0.0"

# ---------------------------------------------------------------------------
# BASICS TRACK -- foundations to get a weak student to a pass. Weight 0.
# ---------------------------------------------------------------------------
basics:
  track: basics
  section: foundations
  paper: both
  topics:
    - id: basics_sentence_structure
      label_en: Making Sentences
      label_bn: বাক্য গঠন
      weight: 0
    - id: basics_parts_of_speech
      label_en: Parts of Speech
      label_bn: Parts of Speech (পদ পরিচিতি)
      weight: 0
    - id: tense
      label_en: Tenses (Basics)
      label_bn: Tense (কাল)
      weight: 0
    - id: basics_verb_forms
      label_en: Verb Forms (V1–V5)
      label_bn: Verb-এর রূপ (V1–V5)
      weight: 0
    - id: basics_subject_verb
      label_en: Subject–Verb Agreement (Basics)
      label_bn: Subject–Verb মিল
      weight: 0
    - id: basics_articles
      label_en: Articles (a / an / the)
      label_bn: Article (a/an/the)
      weight: 0
    - id: basics_prepositions
      label_en: Common Prepositions
      label_bn: Preposition (সাধারণ)
      weight: 0
    - id: basics_wh_questions
      label_en: Making Wh-Questions
      label_bn: Wh-প্রশ্ন গঠন
      weight: 0
    - id: basics_punctuation
      label_en: Capital Letters & Full Stops
      label_bn: বড় হাতের অক্ষর ও যতিচিহ্ন
      weight: 0
    - id: basics_everyday_vocab
      label_en: Everyday Words
      label_bn: দৈনন্দিন শব্দ
      weight: 0

# ---------------------------------------------------------------------------
# HSC 1st PAPER -- Reading (60 marks)
# ---------------------------------------------------------------------------
paper_1st_reading:
  track: hsc
  section: reading
  paper: "1st"
  topics:
    - id: p1_mcq
      label_en: Reading — Multiple Choice
      label_bn: Reading — MCQ
      weight: 5
      remedial: [basics_everyday_vocab]
    - id: p1_short_answer
      label_en: Short Answer Questions
      label_bn: সংক্ষিপ্ত প্রশ্নের উত্তর
      weight: 15
    - id: p1_info_transfer
      label_en: Information Transfer / Flow Chart
      label_bn: তথ্য স্থানান্তর / Flow Chart
      weight: 5
    - id: p1_summary
      label_en: Summary Writing
      label_bn: Summary লেখা
      weight: 10
    - id: p1_cloze_clues
      label_en: Cloze Test (with clues)
      label_bn: Cloze Test (clue সহ)
      weight: 5
      remedial: [basics_everyday_vocab]
    - id: p1_cloze_no_clues
      label_en: Cloze Test (no clues)
      label_bn: Cloze Test (clue ছাড়া)
      weight: 10
      remedial: [basics_prepositions, basics_articles]
    - id: p1_rearranging
      label_en: Rearranging
      label_bn: বাক্য সাজানো (Rearranging)
      weight: 10
      remedial: [basics_sentence_structure]

# ---------------------------------------------------------------------------
# HSC 1st PAPER -- Guided Writing (40 marks)
# ---------------------------------------------------------------------------
paper_1st_writing:
  track: hsc
  section: guided_writing
  paper: "1st"
  topics:
    - id: p1_graph_chart
      label_en: Describing a Graph / Chart
      label_bn: Graph / Chart বর্ণনা
      weight: 15
    - id: p1_story_writing
      label_en: Story Writing
      label_bn: Story লেখা
      weight: 15
    - id: p1_informal_letter
      label_en: Informal Letter
      label_bn: Informal Letter
      weight: 10

# ---------------------------------------------------------------------------
# HSC 2nd PAPER -- Grammar (60 marks). Highest marks-per-effort, auto-gradable.
# ---------------------------------------------------------------------------
paper_2nd_grammar:
  track: hsc
  section: grammar
  paper: "2nd"
  topics:
    - id: p2_preposition
      label_en: Prepositions (gap filling)
      label_bn: Preposition (শূন্যস্থান)
      weight: 5
      remedial: [basics_prepositions]
    - id: p2_special_use
      label_en: Special Uses (gap filling with clues)
      label_bn: Special Use (clue সহ শূন্যস্থান)
      weight: 5
    - id: p2_completing_sentences
      label_en: Completing Sentences (clauses / phrases)
      label_bn: Completing Sentences (clause/phrase)
      weight: 10
      remedial: [basics_sentence_structure]
    - id: p2_right_form_verb
      label_en: Right Form of Verbs & Subject–Verb Agreement
      label_bn: Right Form of Verbs ও Subject–Verb মিল
      weight: 7
      remedial: [basics_verb_forms, basics_subject_verb, tense]
    - id: p2_narration
      label_en: Narration (direct / indirect)
      label_bn: Narration (Direct/Indirect)
      weight: 7
    - id: p2_modifier
      label_en: Use of Modifiers
      label_bn: Modifier
      weight: 5
    - id: p2_connectors
      label_en: Sentence Connectors
      label_bn: Sentence Connectors (linking words)
      weight: 7
    - id: p2_synonym_antonym
      label_en: Synonyms & Antonyms
      label_bn: Synonym ও Antonym
      weight: 7
      remedial: [basics_everyday_vocab]
    - id: p2_punctuation
      label_en: Punctuation
      label_bn: Punctuation (যতিচিহ্ন)
      weight: 7
      remedial: [basics_punctuation]

# ---------------------------------------------------------------------------
# HSC 2nd PAPER -- Composition (40 marks)
# ---------------------------------------------------------------------------
paper_2nd_writing:
  track: hsc
  section: composition
  paper: "2nd"
  topics:
    - id: p2_formal_letter
      label_en: Formal Letter / Email
      label_bn: Formal Letter / Email
      weight: 10
    - id: p2_paragraph_listing
      label_en: Paragraph (listing / description)
      label_bn: Paragraph (listing/বর্ণনা)
      weight: 15
    - id: p2_paragraph_compare
      label_en: Paragraph (comparison / cause–effect)
      label_bn: Paragraph (তুলনা/কারণ-ফল)
      weight: 15

# ---------------------------------------------------------------------------
# CROSS-CUTTING -- vocabulary (feeds flashcards/SRS, not a direct board item)
# ---------------------------------------------------------------------------
cross_cutting:
  track: hsc
  section: vocabulary
  paper: both
  topics:
    - id: vocabulary_hsc_words
      label_en: High-frequency HSC Vocabulary
      label_bn: HSC শব্দভাণ্ডার
      weight: 0

# Legacy remedial ids kept for backward compatibility with earlier content.
# New content links to the basics-track ids above instead.
remedial_topics:
  - id: ssc_vocabulary_basics
    label_en: Core vocabulary and word meanings
  - id: ssc_paragraph_order_basics
    label_en: Basic paragraph / sentence ordering logic
