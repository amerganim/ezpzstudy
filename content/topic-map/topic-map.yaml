  - id: ssc_voice_basics
    label_en: Basic active/passive voice rules
  - id: ssc_narration_basics
    label_en: Basic direct/indirect speech rules
  - id: ssc_preposition_basics
    label_en: Common preposition usage
  - id: ssc_connector_basics
    label_en: Basic linking words
  - id: ssc_tag_question_basics
    label_en: Basic tag question rules
  - id: ssc_sentence_basics
    label_en: Basic sentence types and structure
  - id: ssc_punctuation_basics
    label_en: Basic punctuation rules
  - id: ssc_article_basics
    label_en: Basic article usage (a/an/the)
  - id: ssc_vocabulary_basics
    label_en: Core vocabulary and word meanings
  - id: ssc_paragraph_order_basics
    label_en: Basic paragraph/sentence ordering logic
