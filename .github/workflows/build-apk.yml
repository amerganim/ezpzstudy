name: Build Android APK

# Builds the release APK so it can be shared with teachers/testers.
# - Every push to main: builds and uploads the APK as a downloadable artifact
#   (needs a GitHub login with repo access to download).
# - Pushing a tag like v0.1.0: also publishes a GitHub Release with the APK
#   attached (a public download link you can send to anyone).
# - "Run workflow" button (workflow_dispatch): build on demand.
#
# No signing secrets are needed: Flutter's default release build signs with the
# debug key, which installs fine when sideloaded. (For Google Play you would add
# a real keystore later.)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create a Release on tag builds

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app   # the Flutter app lives in app/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ezpzstudy.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezpzstudy-apk
          path: app/ezpzstudy.apk
          if-no-files-found: error
          # Keep storage inside the free Actions quota; tagged builds are kept
          # permanently as GitHub Releases instead.
          retention-days: 7

      - name: Publish Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/ezpzstudy.apk
          body: |
            EZPZ Study — Android APK.

            To install: on an Android phone, download `ezpzstudy.apk`, then open it.
            If prompted, allow "Install unknown apps" for your browser/Files app.
            (This build is signed with a debug key for testing, not the Play Store.)
